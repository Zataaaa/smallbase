name: CI/CD - Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Job 1: build, run unit tests with coverage, publish artifacts
  # ---------------------------------------------------------------
  build-and-test:
    name: Build, test & publish artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Add coverage summary to the run page
        if: always()
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + s[k].pct + '% |';
            console.log('## Coverage report');
            console.log('| Metric | Coverage |');
            console.log('| --- | --- |');
            ['lines', 'statements', 'functions', 'branches'].forEach(k => console.log(row(k)));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------
  # Job 2: deploy the published artifact to a NEW Cloudflare
  #        Worker (production environment)
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy to Cloudflare (Prod)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code (for wrangler.toml)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist/

      - name: Deploy artifact to Cloudflare (production)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy dist/index.js --no-bundle --env production | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test the production Worker
        if: steps.deploy.outputs.url != ''
        run: |
          sleep 5
          BODY=$(curl -fsS "${{ steps.deploy.outputs.url }}")
          echo "Response: $BODY"
          test "$BODY" = "Hello World!"
